# Controlled checkpoint comparison. Set EVAL_DATA_ROOT and EVAL_PREDICTIONS_ROOT
# to locally downloaded data; evaluation itself never fetches Dropbox or HF data.
name: model_progression_benchmark40_v1
manifest: ../manifests/benchmark40.csv
output_dir: ${EVAL_OUTPUT_ROOT}/model_progression_benchmark40_v1
metrics: [psnr, ssim, lpips, seam, known_region_psnr, known_region_ssim]
datasets:
  id:
    reference_root: ${EVAL_DATA_ROOT}/test/rgb_videos
    input_rgb_root: ${EVAL_DATA_ROOT}/test/rgb_videos
    mask_root: ${EVAL_DATA_ROOT}/test/mask
  ood:
    reference_root: ${EVAL_DATA_ROOT}/ood/rgb_videos
    input_rgb_root: ${EVAL_DATA_ROOT}/ood/rgb_videos
    mask_root: ${EVAL_DATA_ROOT}/ood/mask
methods:
  cosmos:
    label: Official Cosmos-Transfer2.5 depth checkpoint
    prediction_roots:
      id: ${EVAL_PREDICTIONS_ROOT}/cosmos_baseline/test/hardlock
      ood: ${EVAL_PREDICTIONS_ROOT}/cosmos_baseline/ood_nuscenes/hardlock
    prediction_template: "{cohort}/{stem}__official_cosmos_transfer25_depth__hardlock_steps35_guidance7_seed2025_erode8.mp4"
  stage1:
    label: Stage 1 epoch 08 mask-pool PCD-masked checkpoint
    prediction_roots:
      id: ${EVAL_PREDICTIONS_ROOT}/stage1_epoch08_maskpool_pcdmasked_resume_common_mask_2000videos/test/hardlock
      ood: ${EVAL_PREDICTIONS_ROOT}/stage1_epoch08_maskpool_pcdmasked_resume_common_mask_2000videos/ood_nuscenes/hardlock
    prediction_template: "{cohort}/{stem}__stage1_epoch08_maskpool_pcdmasked_resume_common_mask_2000videos__hardlock_steps35_guidance7_seed2025_erode8.mp4"
  stage2:
    label: Stage 2 epoch 04 warm-start PCD-fixed checkpoint
    prediction_roots:
      id: ${EVAL_PREDICTIONS_ROOT}/stage2_epoch04_warmstart_pcdfixed/test/hardlock
      ood: ${EVAL_PREDICTIONS_ROOT}/stage2_epoch04_warmstart_pcdfixed/ood_nuscenes/hardlock
    prediction_template: "{cohort}/{stem}__stage2_epoch04_warmstart_pcdfixed__hardlock_steps35_guidance7_seed2025_erode8.mp4"
evaluation:
  projection_convention: equirectangular_360
  frame_count: 93
  frame_sampling: all_frames_0_to_92_in_file_order
  resize_policy: exact_match_required_no_resize
  interpolation_policy: none
  image_value_normalization: RGB_float32_0_to_1
  random_seed: 2025
  bootstrap_samples: 1000
  mask_white_threshold: 0.5
  known_region_mask_erode_px: 8
  ssim:
    win_size: 11
    gaussian_weights: true
    sigma: 1.5
    use_sample_covariance: false
